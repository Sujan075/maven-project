
name: Maven CI

on:
  push:
  pull_request:

jobs:

  # JOB 1: Build and test Maven project
  maven-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java and Chrome
        run: |
          java -version
          google-chrome --version

      - name: Run Maven tests and package
        run: mvn clean package

      # Transfer JAR to the next job
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: maven-application
          path: target/maven-project-0.0.1-SNAPSHOT.jar
          if-no-files-found: error


  # JOB 2: Build and publish Docker image
  build-and-publish-docker:
    needs: maven-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Download JAR generated by Job 1
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: maven-application
          path: target

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/maven_testing:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/maven_testing:${{ github.sha }}
